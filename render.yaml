services:
  - type: web
    name: techprime-forecast
    runtime: python
    plan: free                # recommended: starter or higher (no cold starts, always-on health checks)
    autoDeploy: true          # merging the monthly retrain PR redeploys the service with the new models
    buildCommand: pip install -r requirements.txt
    # One worker + threads: the in-process rate limiter and the model reload are per worker (see docs/RENDER_SECURITY_GUIDE.md)
    startCommand: gunicorn trends_service:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --limit-request-line 4094 --limit-request-field_size 8190
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FORECAST_API_KEY
        sync: false        # set in the Render dashboard (long random value; same value goes in the PHP service)
      - key: FORECAST_ADMIN_KEY
        sync: false        # separate secret for POST /api/reload (omit it and reload is disabled)
      - key: RATE_LIMIT_PER_MIN
        value: "120"
      - key: AUTH_FAIL_LIMIT
        value: "10"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # - key: HISTORY_CUTOFF   # demo only: e.g. 2026-05 forecasts Jun-Aug as if May were the latest month
      #   value: "2026-05"
      # Live stock for /api/inventory/actions: set STOCK_SOURCE=db plus the read-only forecast_ro DB_* credentials
      # (same values as the GitHub Actions secrets, docs/RENDER_SECURITY_GUIDE.md section 6) in the Render dashboard.
      # - key: STOCK_SOURCE     # 'db' = read products.stock live (cached STOCK_CACHE_SECONDS, default 600); 'file' = CSV
      #   value: "db"
      # - key: DB_HOST          # also DB_PORT, DB_NAME, DB_USER, DB_PASS (sync: false - secrets)
      #   sync: false
      # - key: STOCK_PATH       # stock-on-hand snapshot read when STOCK_SOURCE=file (default current_stock.csv)
      # - key: LEAD_TIME_DAYS   # PLACEHOLDER lead time (no supplier role yet), default 7
      #   value: "7"
