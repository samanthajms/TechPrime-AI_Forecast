# Monthly refresh + retrain. Opens a pull request with the new data/models; merging it lets Render redeploy
# (the model files are part of the deploy, so the live service never depends on its own ephemeral disk).
name: Monthly retrain

on:
  schedule:
    - cron: '0 2 2 * *'        # 02:00 UTC on the 2nd (10:00 Manila): last month is closed everywhere
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only preview the data refresh (no retrain, no PR)'
        type: boolean
        default: false

permissions:
  contents: write              # push the retrain branch
  pull-requests: write         # open the PR (repo setting: Actions may create pull requests)

concurrency:
  group: monthly-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Read-only database user (SELECT on orders, order_items, products, pos_sales, pos_sale_items only).
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-retrain.txt

      - run: pip install -r requirements-retrain.txt

      - name: Preview data refresh (dry run)
        if: ${{ inputs.dry_run }}
        run: python rebuild_features_from_db.py --dry-run

      - name: Refresh history from the live database
        if: ${{ !inputs.dry_run }}
        run: python rebuild_features_from_db.py

      - name: Retrain (80/20 chronological split + regression gate)
        if: ${{ !inputs.dry_run }}
        run: python rebuild_models_v2.py 2>&1 | tee retrain_report.txt   # exit 2 = gate failed, nothing overwritten

      - name: Unit tests
        if: ${{ !inputs.dry_run }}
        run: python -m unittest discover -s tests -v

      - name: Open pull request with the new artifacts
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month=$(date -u +%Y-%m)
          branch="retrain/${month}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add preprocessed_monthly_features.csv preprocessed_monthly_product_features.csv category_code_map.json \
                  xgb_monthly_demand_model.json xgb_monthly_revenue_model.json \
                  category_confidence.csv revenue_category_confidence.csv monthly_predictions.csv revenue_predictions.csv
          if git diff --cached --quiet; then echo "Nothing changed - no PR."; exit 0; fi
          git commit -m "Monthly retrain ${month}"
          git push --force-with-lease origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "Monthly retrain ${month}" \
            --body "Automated monthly refresh from the live database, then retrain (chronological 80/20 split, regression gate passed).

          Review the gate report below, then merge to let Render redeploy.

          \`\`\`
          $(tail -n 40 retrain_report.txt)
          \`\`\`" || echo "PR already exists for $branch"
